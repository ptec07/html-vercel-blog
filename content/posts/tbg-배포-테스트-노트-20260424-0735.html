  --code-bg: #0f172a;
  --code-text: #e5eefc;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: linear-gradient(180deg, #f8f9fc 0%, #f4f6fb 100%);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

.page { padding: 40px 20px 72px; }

  padding: 48px 56px;
  box-shadow: 0 10px 35px rgba(15, 23, 42, 0.06);
}
h1, h2, h3, h4, h5, h6 {
  color: #111827;
  line-height: 1.25;
  margin-top: 1.8em;
  margin-bottom: 0.7em;
  letter-spacing: -0.02em;
}
h1 { font-size: 2.2rem; margin-top: 0; }
h2 { font-size: 1.65rem; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
h3 { font-size: 1.3rem; }
p, ul, ol, blockquote, table, pre { margin-top: 1em; margin-bottom: 1em; }
ul, ol { padding-left: 1.5em; }
li + li { margin-top: 0.35em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
blockquote {
  margin-left: 0;
  padding: 0.9rem 1rem;
  border-left: 4px solid #93c5fd;

  color: var(--muted);
  border-radius: 12px;
}
img { max-width: 100%; height: auto; border-radius: 14px; }
code {
  font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.92em;
}
p code, li code, td code {
  background: var(--inline-code-bg);
  color: #3730a3;
  padding: 0.18em 0.42em;
  border-radius: 8px;
}
pre {
  background: var(--code-bg);
  color: var(--code-text);
  padding: 1rem 1.1rem;
  border-radius: 16px;
  overflow-x: auto;
}
pre code { background: transparent; color: inherit; padding: 0; }
table {
  width: 100%;
  border-collapse: collapse;
  display: block;
  overflow-x: auto;
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 14px;
}
th, td {
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 0.9rem;
  text-align: left;
}
th { background: #f8fafc; color: #111827; }
tr:last-child td { border-bottom: 0; }
@media (max-width: 760px) {
  .page { padding: 18px 12px 40px; }

  h1 { font-size: 1.8rem; }
