  <article>
    <h1>Welcome to the Clean HTML Blog</h1>
    <p>이 사이트는 Markdown에서 보기 좋게 변환한 HTML 문서를 <strong>정적 블로그</strong>처럼 보여주기 위해 만들어졌습니다.</p>
    <h2>사용 방법</h2>
    <ol>
      <li>Markdown를 clean HTML로 변환합니다.</li>
      <li>생긴 <code>.html</code> 파일을 <code>content/posts</code>에 넣습니다.</li>
      <li>Vercel에 배포하면 글 목록과 상세 페이지에서 바로 볼 수 있습니다.</li>
    </ol>
    <blockquote>
      기존 파일을 덮어쓰지 않도록, 가져오기 단계에서 동일한 slug가 있으면 자동으로 <code>-1</code>, <code>-2</code>가 붙도록 설계할 수 있습니다.
    </blockquote>
  </article>
